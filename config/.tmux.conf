# ==============================
# tmux 基础配置
# ==============================

# 设置前缀键为 Ctrl-a (类似 screen)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# 启用鼠标支持
set -g mouse on

# 设置终端颜色为 256 色
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# 设置历史记录行数
set -g history-limit 10000

# 窗口编号从 1 开始
set -g base-index 1
setw -g pane-base-index 1

# 自动重新编号窗口
set -g renumber-windows on

# 减少按键延迟
set -sg escape-time 0

# 设置活动监控
setw -g monitor-activity on
set -g visual-activity off

# ==============================
# 快捷键绑定
# ==============================

# 重新加载配置文件
bind r source-file ~/.tmux.conf \; display "配置已重新加载!"

# 新建窗口继承当前目录
bind c new-window -c "#{pane_current_path}"

# 分屏快捷键
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# 使用 vim 风格的窗格切换
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# 使用 Alt + 方向键切换窗格（不需要前缀键）
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# 使用 Shift + 方向键切换窗口
bind -n S-Left previous-window
bind -n S-Right next-window

# 调整窗格大小
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# 快速窗格切换
bind -r ( switch-client -p
bind -r ) switch-client -n

# ==============================
# 复制模式配置（vim 风格）
# ==============================

setw -g mode-keys vi

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi r send -X rectangle-toggle

# macOS 剪贴板集成
if-shell 'test "$(uname -s)" = "Darwin"' {
  bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
  bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
}

# ==============================
# 状态栏配置 (Catppuccin Mocha)
# ==============================

set -g status-position bottom
set -g status-interval 5

set -g status-style 'bg=#1e1e2e fg=#cdd6f4'

set -g status-left-length 30
set -g status-left '#[fg=#89b4fa,bg=#313244,bold] #S #[fg=#313244,bg=#1e1e2e]'

set -g status-right-length 60
set -g status-right '#[fg=#313244,bg=#1e1e2e]#[fg=#89b4fa,bg=#313244] %Y-%m-%d #[fg=#89b4fa,bg=#313244]│#[fg=#89b4fa,bg=#313244] %H:%M '

setw -g window-status-format '#[fg=#cdd6f4,bg=#1e1e2e] #I:#W '
setw -g window-status-current-format '#[fg=#1e1e2e,bg=#89b4fa,bold] #I:#W '

set -g window-status-separator ''

# ==============================
# 窗格边框
# ==============================

set -g pane-border-style 'fg=#313244'
set -g pane-active-border-style 'fg=#89b4fa'

# ==============================
# iTerm2 集成
# ==============================

set -g allow-passthrough on
set -g set-titles on
set -g set-titles-string '#S:#I:#W - tmux'

# ==============================
# fzf 集成
# ==============================

bind-key s run-shell "tmux neww ~/.tmux/scripts/tmux-sessionizer.sh"
bind-key w run-shell "tmux neww ~/.tmux/scripts/tmux-windowizer.sh"

# ==============================
# 插件管理（TPM - Tmux Plugin Manager）
# ==============================

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# tmux-resurrect 配置
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'

# tmux-continuum 配置（自动保存会话）
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# 初始化 TPM
run '~/.tmux/plugins/tpm/tpm'
